name: app
description: "Frontend of the music room project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  fixnum: ^1.1.0
  provider: ^6.1.5
  shared_preferences: ^2.5.4
  dio: ^5.9.1
  go_router: ^17.1.0
  grpc: ^5.1.0
  protobuf: ^6.0.0
  web_socket_channel: ^3.0.3
  http: ^1.2.0
  uuid: ^4.3.3
  device_info_plus: ^13.3.0
  intl: ^0.20.0
  flutter_secure_storage: ^11.0.0
  flutter_web_auth_2: ^5.1.0
  image_picker: ^1.1.2
  just_audio: ^0.10.6
  just_audio_media_kit: ^2.1.0
  media_kit_libs_linux: ^1.2.1
  geolocator: ^14.1.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.15.1
  flutter_secure_storage_platform_interface: ^2.0.3
  device_info_plus_platform_interface: ^8.1.0
  plugin_platform_interface: ^2.1.8
  flutter_lints: ^6.0.0


# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

# flutter_web_auth_2's login window on Linux (the eval phone), patched: the
# upstream 0.3.0 crashed the app on every close. What changed and why:
# third_party/desktop_webview_window/PATCHED.md.
dependency_overrides:
  desktop_webview_window:
    path: third_party/desktop_webview_window
