org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
android.useAndroidX=true
# The Gradle daemon keeps its heap (several GB) for 3 hours after a build by
# default, starving the emulator that runs next to it. Let it go after 10 idle
# minutes instead, and compile Kotlin inside it rather than in a second daemon.
org.gradle.daemon.idletimeout=600000
kotlin.compiler.execution.strategy=in-process
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false