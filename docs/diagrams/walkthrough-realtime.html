const DATA = {"title": "Realtime Updates", "subtitle": "How one phone's change reaches every other open screen", "kind": "flow", "summary": "Live screens hold a gRPC server stream open (WatchPlaylist or WatchEvent), and the backend never pushes diffs.\nAfter a write commits, the service publishes an empty signal on the object's topic in an in-memory hub; each woken stream re-reads the full state for its own viewer and sends it.\nStreams also re-check access every 5 seconds, and on the app a LiveStream reconnects with backoff when a stream drops.", "diagram": "\ngraph LR\n    subgraph changes[\"Something Changes\"]\n        writers[\"Writes, Publish after Commit\"]\n        scheduler[\"Auto-Advance and Event Ender\"]\n        presence[\"Host Presence Check\"]\n    end\n    subgraph hubGroup[\"Signal Bus\"]\n        hub[(\"Realtime Hub\")]\n        opsLog[(\"Playlist Op Log\")]\n    end\n    subgraph streams[\"Open Streams\"]\n        streamAuth[\"Stream Opening Check\"]\n        watchPlaylist[\"WatchPlaylist\"]\n        watchEvent[\"WatchEvent\"]\n        recheck[\"5 s Access Re-check\"]\n    end\n    subgraph phone[\"Phone App\"]\n        liveStream[\"LiveStream Reconnect\"]\n        appStores[\"Live Stores\"]\n    end\n    writers ==>|\"publish\"| hub\n    writers -->|\"append to\"| opsLog\n    scheduler ==>|\"publish\"| hub\n    presence ==>|\"publish pause\"| hub\n    hub -.->|\"wakes\"| watchPlaylist\n    hub -.->|\"wakes\"| watchEvent\n    streamAuth -->|\"guards\"| watchPlaylist\n    streamAuth -->|\"guards\"| watchEvent\n    recheck -->|\"may end\"| watchPlaylist\n    recheck -->|\"may end\"| watchEvent\n    watchEvent -->|\"feeds open streams to\"| presence\n    watchPlaylist -->|\"full state to\"| liveStream\n    watchEvent -->|\"full state to\"| liveStream\n    liveStream -->|\"updates\"| appStores\n    classDef component fill:#a855f7,stroke:#c084fc,color:#fff\n    classDef composable fill:#7c3aed,stroke:#a78bfa,color:#fff\n    classDef utility fill:#6d28d9,stroke:#8b5cf6,color:#fff\n    classDef external fill:#525252,stroke:#737373,color:#fff\n    classDef event fill:#d8b4fe,stroke:#e9d5ff,color:#000\n    classDef data fill:#9333ea,stroke:#a855f7,color:#fff\n    class writers composable\n    click writers nodeClickHandler \"View details\"\n    class scheduler event\n    click scheduler nodeClickHandler \"View details\"\n    class presence event\n    click presence nodeClickHandler \"View details\"\n    class hub data\n    click hub nodeClickHandler \"View details\"\n    class opsLog data\n    click opsLog nodeClickHandler \"View details\"\n    class streamAuth utility\n    click streamAuth nodeClickHandler \"View details\"\n    class watchPlaylist composable\n    click watchPlaylist nodeClickHandler \"View details\"\n    class watchEvent composable\n    click watchEvent nodeClickHandler \"View details\"\n    class recheck utility\n    click recheck nodeClickHandler \"View details\"\n    class liveStream component\n    click liveStream nodeClickHandler \"View details\"\n    class appStores component\n    click appStores nodeClickHandler \"View details\"\n", "nodes": {"writers": {"title": "Writes, Publish after Commit", "type": "composable", "description": "Every successful playlist, event or delegation write publishes its topic after the transaction commits. A woken stream therefore never reads the old state.", "files": ["backend/internal/playlist/service.go", "backend/internal/event/queue.go", "backend/internal/delegation/service.go"], "code": "\ts.hub.Publish(realtime.Playlist(req.GetPlaylistId()))", "lang": "go"}, "scheduler": {"title": "Auto-Advance and Event Ender", "type": "event", "description": "One in-memory timer per playing event starts the next song when the current one ends; timers are re-armed at boot. A 10 s loop ends events past their end time with nothing playing.", "files": ["backend/internal/event/scheduler.go", "backend/cmd/main.go"], "code": "\ttimer = time.AfterFunc(remaining, func() {", "lang": "go"}, "presence": {"title": "Host Presence Check", "type": "event", "description": "The sound plays from the host's phone, so the server counts the host's open WatchEvent streams. If none is open for more than 5 s, a 2 s sweep pauses playback.", "files": ["backend/internal/event/presence.go"], "code": "const speakerGrace = 5 * time.Second", "lang": "go"}, "hub": {"title": "Realtime Hub", "type": "data", "description": "Topic-keyed signals that carry no data; each subscriber buffers at most one, so a burst of writes becomes one re-read. It is single-process: several backends would need Redis pub/sub instead.", "files": ["backend/internal/realtime/hub.go"], "code": "func Playlist(id int64) Topic { return Topic(fmt.Sprintf(\"playlist:%d\", id)) }\nfunc Event(id int64) Topic    { return Topic(fmt.Sprintf(\"event:%d\", id)) }", "lang": "go"}, "opsLog": {"title": "Playlist Op Log", "type": "data", "description": "Each playlist edit gets a gapless revision and a playlist_ops row. ListPlaylistOpsSince can replay what a client missed, though the app currently re-reads the whole playlist instead.", "files": ["backend/db/query/playlists.sql"], "code": "-- name: BumpPlaylistRevision :one\nUPDATE playlists\nSET revision = revision + 1", "lang": "sql"}, "streamAuth": {"title": "Stream Opening Check", "type": "utility", "description": "The stream interceptor runs the normal policy on the stream's one request. Client and bidirectional streams are refused outright.", "files": ["backend/internal/interceptor/interceptor.go"], "code": "\t\tif info.IsClientStream {\n\t\t\tlog.Printf(\"authz: client-streaming method %s has no authorization path -- denied\", info.FullMethod)\n\t\t\treturn status.Error(codes.PermissionDenied, \"permission denied\")\n\t\t}", "lang": "go"}, "watchPlaylist": {"title": "WatchPlaylist", "type": "composable", "description": "Subscribes before its first read so no change is missed, then sends the full playlist after every signal. Per-viewer fields like viewer_can_edit_songs stay correct because each stream reads for its own viewer.", "files": ["backend/internal/playlist/service.go"], "code": "\tchanged, stop := s.hub.Subscribe(realtime.Playlist(req.GetPlaylistId()))", "lang": "go"}, "watchEvent": {"title": "WatchEvent", "type": "composable", "description": "Sends event, playback and queue as one message on every change, and also when a vote window opens or closes. It registers the viewer's presence for the host check.", "files": ["backend/internal/event/watch.go"], "code": "\tchanged, stop := s.hub.Subscribe(realtime.Event(req.GetEventId()))\n\tdefer s.presence.watch(req.GetEventId(), req.GetViewerId())()", "lang": "go"}, "recheck": {"title": "5 s Access Re-check", "type": "utility", "description": "Even with nothing published, each stream re-checks can_view every 5 s and ends with NotFound if access is gone. With OpenFGA's cache, a removed viewer is cut off within about 5-15 s.", "files": ["backend/internal/event/watch.go"], "code": "const accessRecheck = 5 * time.Second", "lang": "go"}, "liveStream": {"title": "LiveStream Reconnect (app)", "type": "component", "description": "Keeps one Watch stream open while a page is shown and reopens it with stepped backoff. A NotFound (deleted or made private) stops it for good.", "files": ["frontend/app/lib/core/sources/live_stream.dart"], "code": "  static const defaultRetryDelays = [\n    Duration(seconds: 1),\n    Duration(seconds: 2),\n    Duration(seconds: 5),\n    Duration(seconds: 10),", "lang": "dart"}, "appStores": {"title": "Live Stores (app)", "type": "component", "description": "LiveEventStore, PlaylistEditorStore and the app-wide SongPlayer each own a LiveStream. Every push replaces what the screen shows; a button's own reply is shown at once and the next push agrees with it.", "files": ["frontend/app/lib/features/event/presentation/stores/live_event_store.dart", "frontend/app/lib/features/music/playlist/presentation/stores/playlist_editor_store.dart", "frontend/app/lib/features/music/player/song_player.dart"], "code": "    _live = LiveStream(\n      () => _api.watch(_eventPublicId, _userPublicId),", "lang": "dart"}}, "legend": [{"label": "Logic / Service", "color": "#7c3aed"}, {"label": "Trigger / Event", "color": "#d8b4fe"}, {"label": "Data / State", "color": "#9333ea"}, {"label": "Helper", "color": "#6d28d9"}, {"label": "Entry point / UI", "color": "#a855f7"}], "pages": [{"slug": "overview", "title": "Music Room: System Overview"}, {"slug": "backend", "title": "Backend Architecture"}, {"slug": "request-pipeline", "title": "Request Pipeline"}, {"slug": "openfga", "title": "OpenFGA Permission Service"}, {"slug": "auth", "title": "Auth and Sessions"}, {"slug": "realtime", "title": "Realtime Updates"}, {"slug": "frontend", "title": "Frontend Architecture"}, {"slug": "track-vote", "title": "Track Vote Events"}, {"slug": "playlist-editor", "title": "Playlist Editor"}, {"slug": "control-delegation", "title": "Control Delegation"}, {"slug": "data-model", "title": "Data Model"}], "slug": "realtime"};

const MERMAID_THEME = {
  primaryColor: '#0a0a0a', primaryTextColor: '#ffffff', primaryBorderColor: '#2a2a2a',
  lineColor: '#a0a0a0', background: '#000000',
};
const MERMAID_CONFIG = KIND === 'er'
  ? {
      startOnLoad: false, theme: 'dark', securityLevel: 'loose',
      themeVariables: {
        ...MERMAID_THEME,
        entityBkg: '#0a0a0a', entityBorder: '#7c3aed', entityTextColor: '#ffffff',

        clusterBkg: 'rgba(10,10,10,0.8)', clusterBorder: '#7c3aed',

// The SVG group that draws a node: flowchart ids look like "flowchart-<id>-<n>",
// ER groups are tagged by attachEntityClicks below.
function nodeElement(root, nodeId) {
  if (KIND === 'er') return root.querySelector(`[data-entity="${nodeId}"]`);
  const re = new RegExp(`^flowchart-${nodeId}-\\d+$`);
  return [...root.querySelectorAll('.node')].find(n => re.test(n.id)) || null;
}
function allNodeElements(root) {
  return root.querySelectorAll(KIND === 'er' ? '[data-entity]' : '.node');
}

// ER entities take no `click` directive: find each entity's group and bind it by hand.
function attachEntityClicks(root, onClick) {
  for (const name of Object.keys(NODES)) {
    let group = root.querySelector(`g[id^="entity-${name}-"], g[id="entity-${name}"]`);
    if (!group) {
      const label = [...root.querySelectorAll('text, span, div, p')]
        .find(el => el.textContent.trim() === name);
      group = label && (label.closest('g.node') || label.closest('g'));
    }
    if (!group) { console.warn('entity not found:', name); continue; }
    group.dataset.entity = name;
    group.classList.add('wt-entity');
    group.addEventListener('click', () => onClick(name));
  }
}

function usePanZoom() {
  const viewportRef = useRef(null), canvasRef = useRef(null), zoomDisplayRef = useRef(null);
  const st = useRef({ zoom: 1, panX: 0, panY: 0 });
  const drag = useRef({ on: false, lx: 0, ly: 0 });

  const apply = useCallback(() => {
    const { zoom, panX, panY } = st.current;
    if (canvasRef.current) canvasRef.current.style.transform = `translate(${panX}px,${panY}px) scale(${zoom})`;
    if (zoomDisplayRef.current) zoomDisplayRef.current.textContent = Math.round(zoom * 100) + '%';
  }, []);

  const fitToScreen = useCallback(() => {
    const svg = canvasRef.current?.querySelector('svg');
    const vp = viewportRef.current;
    if (!svg || !vp) return;
    const s = st.current;
    const vw = vp.clientWidth, vh = vp.clientHeight;
    const sw = canvasRef.current.getBoundingClientRect().width / s.zoom;
    const sh = canvasRef.current.getBoundingClientRect().height / s.zoom;
    const fit = Math.max(0.15, Math.min(2, Math.min((vw - 40) / sw, (vh - 40) / sh)));
    s.zoom = fit; s.panX = (vw - sw * fit) / 2; s.panY = (vh - sh * fit) / 2;
    apply();
  }, [apply]);

  useEffect(() => {
    const vp = viewportRef.current;
    if (!vp) return;
    const onWheel = (e) => {
      e.preventDefault();
      const r = vp.getBoundingClientRect();
      const mx = e.clientX - r.left, my = e.clientY - r.top, s = st.current;
      const f = e.deltaY < 0 ? 1.12 : 1 / 1.12;
      const nz = Math.min(4, Math.max(0.15, s.zoom * f)), sc = nz / s.zoom;
      s.panX = mx - sc * (mx - s.panX); s.panY = my - sc * (my - s.panY); s.zoom = nz;
      apply();
    };
    const onDown = (e) => {
      if (e.target.closest('.node, .wt-entity')) return;
      drag.current = { on: true, lx: e.clientX, ly: e.clientY };
      vp.setPointerCapture(e.pointerId);
    };
    const onMove = (e) => {
      const d = drag.current; if (!d.on) return;
      st.current.panX += e.clientX - d.lx; st.current.panY += e.clientY - d.ly;
      d.lx = e.clientX; d.ly = e.clientY; apply();
    };
    const onUp = () => { drag.current.on = false; };
    vp.addEventListener('wheel', onWheel, { passive: false });
    vp.addEventListener('pointerdown', onDown);
    vp.addEventListener('pointermove', onMove);
    vp.addEventListener('pointerup', onUp);
    vp.addEventListener('pointercancel', onUp);
    window.addEventListener('resize', fitToScreen);
    return () => {
      vp.removeEventListener('wheel', onWheel);
      vp.removeEventListener('pointerdown', onDown);
      vp.removeEventListener('pointermove', onMove);
      vp.removeEventListener('pointerup', onUp);
      vp.removeEventListener('pointercancel', onUp);
      window.removeEventListener('resize', fitToScreen);
    };
  }, [apply, fitToScreen]);

  const zoomIn = useCallback(() => { st.current.zoom = Math.min(4, st.current.zoom * 1.25); apply(); }, [apply]);
  const zoomOut = useCallback(() => { st.current.zoom = Math.max(0.15, st.current.zoom / 1.25); apply(); }, [apply]);
  return { viewportRef, canvasRef, zoomDisplayRef, zoomIn, zoomOut, fitToScreen };
}

function MermaidDiagram({ onNodeClick, onRendered }) {
  const ref = useRef(null);
  useEffect(() => {
    window.nodeClickHandler = onNodeClick;
    mermaid.initialize(MERMAID_CONFIG);
    mermaid.render('walkthrough-diagram', DIAGRAM).then(({ svg, bindFunctions }) => {
      if (!ref.current) return;
      ref.current.innerHTML = svg;
      bindFunctions?.(ref.current);
      if (KIND === 'er') attachEntityClicks(ref.current, onNodeClick);
      document.body.dataset.rendered = 'true';
      onRendered();
    }).catch((e) => {
      console.error('Mermaid render failed:', e);
      document.body.dataset.rendered = 'error';
      if (ref.current) ref.current.textContent = 'Diagram failed to render: ' + e.message;
    });
    return () => { delete window.nodeClickHandler; };
  }, [onNodeClick, onRendered]);
  return h('div', { ref, className: 'mermaid-wrap' });
}

    h('p', { className: 'text-sm text-wt-muted leading-relaxed' }, SUMMARY),

function DetailPanel({ nodeId, node, onClose }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [onClose]);
  const codeHtml = HIGHLIGHTED[nodeId];
  return h('div', {
    className: 'fixed top-4 right-4 bottom-4 w-[560px] max-w-[calc(100vw-2rem)] z-30 bg-wt-surface border border-wt-border rounded-xl shadow-2xl flex flex-col overflow-hidden',
  },
    h('button', {
      onClick: onClose,
      className: 'absolute top-3 right-3 z-10 w-7 h-7 rounded-md border border-wt-border bg-wt-raised text-wt-muted flex items-center justify-center text-lg hover:bg-wt-red hover:border-wt-red hover:text-white transition-colors',
    }, '×'),
    h('div', { className: 'flex-1 overflow-y-auto p-5' },
      h('h2', { className: 'text-lg font-bold text-wt-fg mb-3 pr-9' }, node.title),
      h('div', { className: 'dt-body' }, h('p', null, node.description)),
      h('div', { className: 'dt-body' },
        codeHtml
          ? h('div', { dangerouslySetInnerHTML: { __html: codeHtml } })
          : h('pre', { className: 'code-fallback' }, h('code', null, node.code))),
      h('div', { className: 'mt-4 pt-3 border-t border-wt-border' },
        h('div', { className: 'text-[0.7rem] uppercase tracking-wider text-wt-muted font-semibold mb-1.5' }, 'Files'),
        h('code', { className: 'text-sm text-wt-file font-mono leading-relaxed break-all' },
          node.files.map((f, i) => h('span', { key: i }, f, h('br'))))))
  );
}

function ZoomControls({ zoomDisplayRef, onZoomIn, onZoomOut, onFit }) {
  const btn = 'w-8 h-8 rounded-md border border-wt-border bg-wt-surface text-wt-muted hover:bg-wt-raised hover:text-wt-fg transition-colors text-sm';
  return h('div', { className: 'fixed bottom-5 left-5 z-20 flex items-center gap-1.5' },
    h('button', { className: btn, onClick: onZoomOut, title: 'Zoom out' }, '−'),
    h('span', { ref: zoomDisplayRef, className: 'w-12 text-center text-xs text-wt-muted tabular-nums' }, '100%'),
    h('button', { className: btn, onClick: onZoomIn, title: 'Zoom in' }, '+'),
    h('button', { className: btn + ' w-auto px-2.5', onClick: onFit, title: 'Fit to screen' }, 'Fit'));
}

// Jump between the walkthroughs of this folder.
function PageNav() {
  return h('div', { className: 'fixed top-3.5 right-5 z-20' },
    h('select', {
      value: SLUG,
      onChange: (e) => { window.location.href = `walkthrough-${e.target.value}.html`; },

      'aria-label': 'Other walkthroughs',

}

function App() {
  const [activeId, setActiveId] = useState(null);
  const [summaryCollapsed, setSummaryCollapsed] = useState(true);
  const pz = usePanZoom();

  const setActiveNode = useCallback((nodeId) => {
    setActiveId(nodeId);
    const root = document.querySelector('.mermaid-wrap');
    allNodeElements(root).forEach(n => { n.style.opacity = nodeId ? '0.4' : '1'; });
    const el = nodeId && nodeElement(root, nodeId);
    if (el) el.style.opacity = '1';
  }, []);
  const closeDetail = useCallback(() => {
    setActiveId(null);
    allNodeElements(document.querySelector('.mermaid-wrap')).forEach(n => { n.style.opacity = '1'; });
  }, []);
  const onRendered = useCallback(() => { setTimeout(pz.fitToScreen, 50); }, [pz.fitToScreen]);

  return h(React.Fragment, null,
    h('header', { className: 'fixed top-0 inset-x-0 z-10 px-6 py-3.5 bg-gradient-to-b from-wt-bg to-transparent pointer-events-none' },
      h('h1', { className: 'text-base font-semibold text-wt-fg' }, TITLE),
      h('p', { className: 'text-sm text-wt-muted mt-0.5' }, SUBTITLE)),
    h(Summary, { collapsed: summaryCollapsed, onToggle: () => setSummaryCollapsed(c => !c) }),
    h('div', { ref: pz.viewportRef, className: 'w-full h-screen overflow-hidden cursor-grab active:cursor-grabbing' },
      h('div', { ref: pz.canvasRef, className: 'origin-top-left will-change-transform inline-block p-[80px_60px_60px]' },
        h(MermaidDiagram, { onNodeClick: setActiveNode, onRendered }))),
    h(ZoomControls, { zoomDisplayRef: pz.zoomDisplayRef, onZoomIn: pz.zoomIn, onZoomOut: pz.zoomOut, onFit: pz.fitToScreen }),
    h('div', { className: 'fixed bottom-5 left-1/2 -translate-x-1/2 z-20 flex flex-wrap justify-center gap-4 px-4 py-2 bg-wt-surface border border-wt-border rounded-lg shadow-xl' },
      LEGEND.map(l => h('span', { key: l.label, className: 'flex items-center gap-1.5 text-xs text-wt-muted whitespace-nowrap' },
        h('span', { className: 'w-2 h-2 rounded-full', style: { background: l.color } }), l.label))),
    h(PageNav),
    activeId && NODES[activeId] && h(DetailPanel, { nodeId: activeId, node: NODES[activeId], onClose: closeDetail }),
    h('div', { className: 'fixed bottom-5 right-5 z-20 text-xs text-wt-muted opacity-50' },
      h('kbd', null, 'Scroll'), ' zoom · ', h('kbd', null, 'Drag'), ' pan · Click nodes'));
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
