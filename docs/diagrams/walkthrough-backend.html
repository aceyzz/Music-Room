const DATA = {"title": "Backend Architecture", "subtitle": "One Go process: two listeners, one interceptor, six services", "kind": "flow", "summary": "main.go wires everything at boot: migrations, the Postgres pool, OpenFGA, the outbox worker, the realtime hub and six gRPC services.\nREST requests are translated by grpc-gateway and sent back into the gRPC port, so both protocols share the same handlers and permission checks.\nServices talk to Postgres through sqlc-generated queries, and to Deezer and the Rust resizer over HTTP; Redis runs in compose, but the backend no longer connects to it.", "diagram": "\ngraph TD\n    subgraph startup[\"Startup\"]\n        boot[\"Boot Sequence\"]\n    end\n    subgraph entry[\"Ways In\"]\n        httpMux[\"HTTP Mux and REST Gateway\"]\n        grpcServer[\"gRPC Server\"]\n        interceptor[\"Permission Interceptor\"]\n    end\n    subgraph services[\"Domain Services\"]\n        authService[\"Auth Service\"]\n        playlistService[\"Playlist Service\"]\n        eventService[\"Event Service\"]\n        delegationService[\"Delegation Service\"]\n    end\n    subgraph deps[\"Storage and Outside Services\"]\n        database[(\"Database Layer\")]\n        fgaClient[\"OpenFGA Client\"]\n        mediaClient[\"Image Storage and Resizer\"]\n        deezer[\"Deezer Client\"]\n    end\n    boot -->|\"migrates\"| database\n    boot -->|\"pings and pins model\"| fgaClient\n    boot -->|\"builds\"| grpcServer\n    boot -->|\"serves\"| httpMux\n    httpMux -->|\"dials over loopback\"| grpcServer\n    grpcServer -->|\"wraps every call with\"| interceptor\n    interceptor -->|\"checks with\"| fgaClient\n    interceptor -->|\"routes to\"| authService\n    interceptor -->|\"routes to\"| playlistService\n    interceptor -->|\"routes to\"| eventService\n    interceptor -->|\"routes to\"| delegationService\n    authService -->|\"stores sessions in\"| database\n    playlistService -->|\"reads and writes\"| database\n    eventService -->|\"reads and writes\"| database\n    delegationService -->|\"reads and writes\"| database\n    playlistService -->|\"fetches songs from\"| deezer\n    eventService -->|\"fetches songs from\"| deezer\n    playlistService -->|\"saves covers with\"| mediaClient\n    classDef component fill:#a855f7,stroke:#c084fc,color:#fff\n    classDef composable fill:#7c3aed,stroke:#a78bfa,color:#fff\n    classDef utility fill:#6d28d9,stroke:#8b5cf6,color:#fff\n    classDef external fill:#525252,stroke:#737373,color:#fff\n    classDef event fill:#d8b4fe,stroke:#e9d5ff,color:#000\n    classDef data fill:#9333ea,stroke:#a855f7,color:#fff\n    class boot component\n    click boot nodeClickHandler \"View details\"\n    class httpMux composable\n    click httpMux nodeClickHandler \"View details\"\n    class grpcServer composable\n    click grpcServer nodeClickHandler \"View details\"\n    class interceptor composable\n    click interceptor nodeClickHandler \"View details\"\n    class authService composable\n    click authService nodeClickHandler \"View details\"\n    class playlistService composable\n    click playlistService nodeClickHandler \"View details\"\n    class eventService composable\n    click eventService nodeClickHandler \"View details\"\n    class delegationService composable\n    click delegationService nodeClickHandler \"View details\"\n    class database data\n    click database nodeClickHandler \"View details\"\n    class fgaClient external\n    click fgaClient nodeClickHandler \"View details\"\n    class mediaClient utility\n    click mediaClient nodeClickHandler \"View details\"\n    class deezer external\n    click deezer nodeClickHandler \"View details\"\n", "nodes": {"boot": {"title": "Boot Sequence", "type": "component", "description": "Loads .env, runs migrations, opens the pool, connects OpenFGA, starts the outbox worker and the event loops, then serves. It fails fast when Postgres or OpenFGA is missing.", "files": ["backend/cmd/main.go"], "code": "\tgrpcAddr := config.Getenv(\"APP_GRPC_ADDR\", \":50051\")\n\thttpAddr := config.Getenv(\"APP_HTTP_ADDR\", \":8080\")\n\tif err := runMigrations(dbURL); err != nil {", "lang": "go"}, "httpMux": {"title": "HTTP Mux and REST Gateway", "type": "composable", "description": "grpc-gateway exposes all six services as REST/JSON on :8081 in compose. The same mux serves Swagger, image files and the OAuth callback page.", "files": ["backend/cmd/main.go"], "code": "\tgwmux := runtime.NewServeMux(runtime.WithIncomingHeaderMatcher(activityHeaderMatcher))\n\ttopMux.Handle(\"/media/\", http.StripPrefix(\"/media/\", media.FileHandler(mediaStore.Dir())))\n\ttopMux.Handle(\"/\", gwmux) // gRPC-Gateway REST routes", "lang": "go"}, "grpcServer": {"title": "gRPC Server", "type": "composable", "description": "Listens on :50051 with one unary and one stream interceptor. Server reflection is on, so grpcurl works.", "files": ["backend/cmd/main.go"], "code": "\tgrpcServer := grpc.NewServer(\n\t\tgrpc.MaxRecvMsgSize(media.MaxUploadBytes+1<<20),\n\t\tgrpc.UnaryInterceptor(permissions.Unary()),\n\t\tgrpc.StreamInterceptor(permissions.Stream()),\n\t)", "lang": "go"}, "interceptor": {"title": "Permission Interceptor", "type": "composable", "description": "The single enforcement point: rate limit, session, OpenFGA checks, id resolution, then the handler and an activity log row. See the request-pipeline walkthrough for each step.", "files": ["backend/internal/interceptor/interceptor.go"], "code": "\tif err := i.throttleIP(ctx); err != nil {\n\t\treturn nil, err\n\t}\n\tauthorized, err := i.authorize(ctx, info.FullMethod, req)", "lang": "go"}, "authService": {"title": "Auth Service", "type": "composable", "description": "A thin gRPC handler over register, login, logout, email codes, password reset and OAuth. Sessions are opaque tokens whose hash lives in user_sessions.", "files": ["backend/internal/services/auth_service.go", "backend/internal/auth/"], "code": "\tres, err := s.login.Login(ctx, req.GetEmail(), req.GetPassword(), clientip.FromContext(ctx))", "lang": "go"}, "playlistService": {"title": "Playlist Service", "type": "composable", "description": "Collaborative playlists: CRUD, songs, members, covers and the WatchPlaylist stream. Every song edit bumps a revision under a row lock and appends to an op log.", "files": ["backend/internal/playlist/service.go", "backend/internal/playlist/repository.go"], "code": "\t\trevision, err := queries.BumpPlaylistRevision(ctx, req.GetPlaylistId())", "lang": "go"}, "eventService": {"title": "Event Service", "type": "composable", "description": "Track Vote: the voting queue, playback state and WatchEvent stream. Background loops auto-advance songs, end overdue events and pause when the host leaves.", "files": ["backend/internal/event/", "backend/cmd/main.go"], "code": "\tgo eventSvc.RunEventEnder(ctx, 10*time.Second)\n\tgo eventSvc.RunSpeakerCheck(ctx, 2*time.Second)", "lang": "go"}, "delegationService": {"title": "Delegation Service", "type": "composable", "description": "Registers devices and grants a friend control of the event's speaker for one event. Each licence change wakes that event's viewers.", "files": ["backend/internal/delegation/service.go"], "code": "func (s *Service) publishEvent(license db.DeviceControlLicense) {\n\tif license.EventID.Valid {\n\t\ts.hub.Publish(realtime.Event(license.EventID.Int64))", "lang": "go"}, "database": {"title": "Database Layer (goose + sqlc)", "type": "data", "description": "23 flat migrations are embedded and applied at boot; 16 hand-written query files become typed Go through sqlc. Flat is required: the embed pattern and goose.Up both ignore subfolders.", "files": ["backend/db/embed.go", "backend/sqlc.yaml", "backend/db/query/"], "code": "//go:embed schema/*.sql\nvar MigrationsFS embed.FS", "lang": "go"}, "fgaClient": {"title": "OpenFGA Client", "type": "external", "description": "A thin wrapper over the OpenFGA SDK: Check and ListObjects to read, Apply to write tuples. The OpenFGA walkthrough covers the model and sync.", "files": ["backend/internal/authz/check.go", "backend/internal/authz/client.go"], "code": "\tresponse, err := c.fga.Check(ctx).Body(body).Execute()", "lang": "go"}, "mediaClient": {"title": "Image Storage and Resizer", "type": "utility", "description": "Sends the upload to the Rust image-service for a PNG thumbnail, then writes both files under APP_IMAGE_STORAGE_DIR. There is no S3; /media/ serves the folder.", "files": ["backend/internal/media/client.go", "image-service/src/main.rs"], "code": "\treq, err := http.NewRequestWithContext(ctx, http.MethodPost, c.baseURL+\"/resize\", bytes.NewReader(payload))", "lang": "go"}, "deezer": {"title": "Deezer Client", "type": "external", "description": "Calls api.deezer.com and maps its JSON into SongDTO at the boundary. Tracks are then upserted into songs so playlists and queues can reference them by foreign key.", "files": ["backend/internal/music_provider/deezer_client.go", "backend/internal/songs/service.go"], "code": "\treturn s.q.UpsertSongFromDeezer(ctx, sqlc.UpsertSongFromDeezerParams{", "lang": "go"}}, "legend": [{"label": "Entry point / UI", "color": "#a855f7"}, {"label": "Logic / Service", "color": "#7c3aed"}, {"label": "Data / State", "color": "#9333ea"}, {"label": "External system", "color": "#525252"}, {"label": "Helper", "color": "#6d28d9"}], "pages": [{"slug": "overview", "title": "Music Room: System Overview"}, {"slug": "backend", "title": "Backend Architecture"}, {"slug": "request-pipeline", "title": "Request Pipeline"}, {"slug": "openfga", "title": "OpenFGA Permission Service"}, {"slug": "auth", "title": "Auth and Sessions"}, {"slug": "realtime", "title": "Realtime Updates"}, {"slug": "frontend", "title": "Frontend Architecture"}, {"slug": "track-vote", "title": "Track Vote Events"}, {"slug": "playlist-editor", "title": "Playlist Editor"}, {"slug": "control-delegation", "title": "Control Delegation"}, {"slug": "data-model", "title": "Data Model"}], "slug": "backend"};
const { title: TITLE, subtitle: SUBTITLE, kind: KIND, summary: SUMMARY,

const MERMAID_THEME = {
  primaryColor: '#0a0a0a', primaryTextColor: '#ffffff', primaryBorderColor: '#2a2a2a',
  lineColor: '#a0a0a0', background: '#000000',

const MERMAID_CONFIG = KIND === 'er'

      startOnLoad: false, theme: 'dark', securityLevel: 'loose',

        ...MERMAID_THEME,
        entityBkg: '#0a0a0a', entityBorder: '#7c3aed', entityTextColor: '#ffffff',

// The SVG group that draws a node: flowchart ids look like "flowchart-<id>-<n>",
// ER groups are tagged by attachEntityClicks below.
function nodeElement(root, nodeId) {
  if (KIND === 'er') return root.querySelector(`[data-entity="${nodeId}"]`);
  const re = new RegExp(`^flowchart-${nodeId}-\\d+$`);
  return [...root.querySelectorAll('.node')].find(n => re.test(n.id)) || null;
}
function allNodeElements(root) {
  return root.querySelectorAll(KIND === 'er' ? '[data-entity]' : '.node');
}

// ER entities take no `click` directive: find each entity's group and bind it by hand.
function attachEntityClicks(root, onClick) {
  for (const name of Object.keys(NODES)) {
    let group = root.querySelector(`g[id^="entity-${name}-"], g[id="entity-${name}"]`);
    if (!group) {
      const label = [...root.querySelectorAll('text, span, div, p')]
        .find(el => el.textContent.trim() === name);
      group = label && (label.closest('g.node') || label.closest('g'));
    }
    if (!group) { console.warn('entity not found:', name); continue; }
    group.dataset.entity = name;
    group.classList.add('wt-entity');
    group.addEventListener('click', () => onClick(name));
  }
}

function usePanZoom() {
  const viewportRef = useRef(null), canvasRef = useRef(null), zoomDisplayRef = useRef(null);
  const st = useRef({ zoom: 1, panX: 0, panY: 0 });
  const drag = useRef({ on: false, lx: 0, ly: 0 });

  const apply = useCallback(() => {
    const { zoom, panX, panY } = st.current;
    if (canvasRef.current) canvasRef.current.style.transform = `translate(${panX}px,${panY}px) scale(${zoom})`;
    if (zoomDisplayRef.current) zoomDisplayRef.current.textContent = Math.round(zoom * 100) + '%';
  }, []);

  const fitToScreen = useCallback(() => {
    const svg = canvasRef.current?.querySelector('svg');
    const vp = viewportRef.current;
    if (!svg || !vp) return;
    const s = st.current;
    const vw = vp.clientWidth, vh = vp.clientHeight;
    const sw = canvasRef.current.getBoundingClientRect().width / s.zoom;
    const sh = canvasRef.current.getBoundingClientRect().height / s.zoom;
    const fit = Math.max(0.15, Math.min(2, Math.min((vw - 40) / sw, (vh - 40) / sh)));
    s.zoom = fit; s.panX = (vw - sw * fit) / 2; s.panY = (vh - sh * fit) / 2;
    apply();
  }, [apply]);

  useEffect(() => {
    const vp = viewportRef.current;
    if (!vp) return;
    const onWheel = (e) => {
      e.preventDefault();
      const r = vp.getBoundingClientRect();
      const mx = e.clientX - r.left, my = e.clientY - r.top, s = st.current;
      const f = e.deltaY < 0 ? 1.12 : 1 / 1.12;
      const nz = Math.min(4, Math.max(0.15, s.zoom * f)), sc = nz / s.zoom;
      s.panX = mx - sc * (mx - s.panX); s.panY = my - sc * (my - s.panY); s.zoom = nz;
      apply();
    };
    const onDown = (e) => {
      if (e.target.closest('.node, .wt-entity')) return;
      drag.current = { on: true, lx: e.clientX, ly: e.clientY };
      vp.setPointerCapture(e.pointerId);
    };
    const onMove = (e) => {
      const d = drag.current; if (!d.on) return;
      st.current.panX += e.clientX - d.lx; st.current.panY += e.clientY - d.ly;
      d.lx = e.clientX; d.ly = e.clientY; apply();
    };
    const onUp = () => { drag.current.on = false; };
    vp.addEventListener('wheel', onWheel, { passive: false });
    vp.addEventListener('pointerdown', onDown);
    vp.addEventListener('pointermove', onMove);
    vp.addEventListener('pointerup', onUp);
    vp.addEventListener('pointercancel', onUp);
    window.addEventListener('resize', fitToScreen);
    return () => {
      vp.removeEventListener('wheel', onWheel);
      vp.removeEventListener('pointerdown', onDown);
      vp.removeEventListener('pointermove', onMove);
      vp.removeEventListener('pointerup', onUp);
      vp.removeEventListener('pointercancel', onUp);
      window.removeEventListener('resize', fitToScreen);
    };
  }, [apply, fitToScreen]);

  const zoomIn = useCallback(() => { st.current.zoom = Math.min(4, st.current.zoom * 1.25); apply(); }, [apply]);
  const zoomOut = useCallback(() => { st.current.zoom = Math.max(0.15, st.current.zoom / 1.25); apply(); }, [apply]);
  return { viewportRef, canvasRef, zoomDisplayRef, zoomIn, zoomOut, fitToScreen };
}

function MermaidDiagram({ onNodeClick, onRendered }) {
  const ref = useRef(null);
  useEffect(() => {
    window.nodeClickHandler = onNodeClick;
    mermaid.initialize(MERMAID_CONFIG);
    mermaid.render('walkthrough-diagram', DIAGRAM).then(({ svg, bindFunctions }) => {
      if (!ref.current) return;
      ref.current.innerHTML = svg;
      bindFunctions?.(ref.current);
      if (KIND === 'er') attachEntityClicks(ref.current, onNodeClick);
      document.body.dataset.rendered = 'true';
      onRendered();
    }).catch((e) => {
      console.error('Mermaid render failed:', e);
      document.body.dataset.rendered = 'error';
      if (ref.current) ref.current.textContent = 'Diagram failed to render: ' + e.message;
    });
    return () => { delete window.nodeClickHandler; };
  }, [onNodeClick, onRendered]);
  return h('div', { ref, className: 'mermaid-wrap' });
}

    }, h('span', { className: 'text-xs text-wt-muted font-medium' }, 'ℹ︎ Summary'));

  return h('div', {

function DetailPanel({ nodeId, node, onClose }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [onClose]);
  const codeHtml = HIGHLIGHTED[nodeId];
  return h('div', {
    className: 'fixed top-4 right-4 bottom-4 w-[560px] max-w-[calc(100vw-2rem)] z-30 bg-wt-surface border border-wt-border rounded-xl shadow-2xl flex flex-col overflow-hidden',
  },
    h('button', {
      onClick: onClose,
      className: 'absolute top-3 right-3 z-10 w-7 h-7 rounded-md border border-wt-border bg-wt-raised text-wt-muted flex items-center justify-center text-lg hover:bg-wt-red hover:border-wt-red hover:text-white transition-colors',
    }, '×'),
    h('div', { className: 'flex-1 overflow-y-auto p-5' },
      h('h2', { className: 'text-lg font-bold text-wt-fg mb-3 pr-9' }, node.title),
      h('div', { className: 'dt-body' }, h('p', null, node.description)),
      h('div', { className: 'dt-body' },
        codeHtml
          ? h('div', { dangerouslySetInnerHTML: { __html: codeHtml } })
          : h('pre', { className: 'code-fallback' }, h('code', null, node.code))),
      h('div', { className: 'mt-4 pt-3 border-t border-wt-border' },
        h('div', { className: 'text-[0.7rem] uppercase tracking-wider text-wt-muted font-semibold mb-1.5' }, 'Files'),
        h('code', { className: 'text-sm text-wt-file font-mono leading-relaxed break-all' },
          node.files.map((f, i) => h('span', { key: i }, f, h('br'))))))
  );
}

function ZoomControls({ zoomDisplayRef, onZoomIn, onZoomOut, onFit }) {
  const btn = 'w-8 h-8 rounded-md border border-wt-border bg-wt-surface text-wt-muted hover:bg-wt-raised hover:text-wt-fg transition-colors text-sm';
  return h('div', { className: 'fixed bottom-5 left-5 z-20 flex items-center gap-1.5' },
    h('button', { className: btn, onClick: onZoomOut, title: 'Zoom out' }, '−'),
    h('span', { ref: zoomDisplayRef, className: 'w-12 text-center text-xs text-wt-muted tabular-nums' }, '100%'),
    h('button', { className: btn, onClick: onZoomIn, title: 'Zoom in' }, '+'),
    h('button', { className: btn + ' w-auto px-2.5', onClick: onFit, title: 'Fit to screen' }, 'Fit'));
}

// Jump between the walkthroughs of this folder.
function PageNav() {
  return h('div', { className: 'fixed top-3.5 right-5 z-20' },
    h('select', {
      value: SLUG,
      onChange: (e) => { window.location.href = `walkthrough-${e.target.value}.html`; },
      className: 'bg-wt-surface border border-wt-border rounded-md text-xs text-wt-muted px-2 py-1.5 cursor-pointer',
      'aria-label': 'Other walkthroughs',
    }, PAGES.map(p => h('option', { key: p.slug, value: p.slug }, p.title))));
}

function App() {
  const [activeId, setActiveId] = useState(null);
  const [summaryCollapsed, setSummaryCollapsed] = useState(true);
  const pz = usePanZoom();

  const setActiveNode = useCallback((nodeId) => {
    setActiveId(nodeId);
    const root = document.querySelector('.mermaid-wrap');
    allNodeElements(root).forEach(n => { n.style.opacity = nodeId ? '0.4' : '1'; });
    const el = nodeId && nodeElement(root, nodeId);
    if (el) el.style.opacity = '1';
  }, []);
  const closeDetail = useCallback(() => {
    setActiveId(null);
    allNodeElements(document.querySelector('.mermaid-wrap')).forEach(n => { n.style.opacity = '1'; });
  }, []);
  const onRendered = useCallback(() => { setTimeout(pz.fitToScreen, 50); }, [pz.fitToScreen]);

  return h(React.Fragment, null,
    h('header', { className: 'fixed top-0 inset-x-0 z-10 px-6 py-3.5 bg-gradient-to-b from-wt-bg to-transparent pointer-events-none' },
      h('h1', { className: 'text-base font-semibold text-wt-fg' }, TITLE),
      h('p', { className: 'text-sm text-wt-muted mt-0.5' }, SUBTITLE)),
    h(Summary, { collapsed: summaryCollapsed, onToggle: () => setSummaryCollapsed(c => !c) }),
    h('div', { ref: pz.viewportRef, className: 'w-full h-screen overflow-hidden cursor-grab active:cursor-grabbing' },
      h('div', { ref: pz.canvasRef, className: 'origin-top-left will-change-transform inline-block p-[80px_60px_60px]' },
        h(MermaidDiagram, { onNodeClick: setActiveNode, onRendered }))),
    h(ZoomControls, { zoomDisplayRef: pz.zoomDisplayRef, onZoomIn: pz.zoomIn, onZoomOut: pz.zoomOut, onFit: pz.fitToScreen }),
    h('div', { className: 'fixed bottom-5 left-1/2 -translate-x-1/2 z-20 flex flex-wrap justify-center gap-4 px-4 py-2 bg-wt-surface border border-wt-border rounded-lg shadow-xl' },
      LEGEND.map(l => h('span', { key: l.label, className: 'flex items-center gap-1.5 text-xs text-wt-muted whitespace-nowrap' },
        h('span', { className: 'w-2 h-2 rounded-full', style: { background: l.color } }), l.label))),
    h(PageNav),
    activeId && NODES[activeId] && h(DetailPanel, { nodeId: activeId, node: NODES[activeId], onClose: closeDetail }),
    h('div', { className: 'fixed bottom-5 right-5 z-20 text-xs text-wt-muted opacity-50' },
      h('kbd', null, 'Scroll'), ' zoom · ', h('kbd', null, 'Drag'), ' pan · Click nodes'));
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
