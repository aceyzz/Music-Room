const DATA = {"title": "Auth and Sessions", "subtitle": "Accounts, logins and opaque session tokens, from the app to user_sessions", "kind": "flow", "summary": "A login or register returns a random 32-byte token once; the server stores only its SHA-256 hash in user_sessions, so revoking a session is one UPDATE.\nEvery later call carries the token as a Bearer header, and the interceptor looks it up, checking revocation, a 30-day absolute expiry, a 7-day idle limit and account status.\nEmail verification and password reset use hashed 6-digit codes sent by a pluggable mailer; OAuth (Google, 42) exchanges the code server-side and opens the same kind of session.", "diagram": "\ngraph TD\n    subgraph app[\"Phone App\"]\n        sessionStore[\"Session Store\"]\n        authInterceptor[\"App Auth Interceptor\"]\n    end\n    subgraph accounts[\"Getting a Session\"]\n        authHandler[\"Auth Service Handler\"]\n        registerSvc[\"Registration\"]\n        loginSvc[\"Password Login\"]\n        oauthSvc[\"OAuth Login\"]\n        oauthCallback[\"OAuth Bounce Page\"]\n    end\n    subgraph codes[\"Codes and Secrets\"]\n        tokenSecurity[\"Tokens and Password Hashing\"]\n        oneTimeCode[\"One-Time Codes\"]\n        mailer[\"Mailer\"]\n    end\n    subgraph checking[\"Checking a Session\"]\n        authenticator[\"Session Authenticator\"]\n        sessionsTable[(\"Sessions Table\")]\n    end\n    sessionStore -->|\"calls\"| authHandler\n    authHandler -->|\"delegates to\"| registerSvc\n    authHandler -->|\"delegates to\"| loginSvc\n    authHandler -->|\"delegates to\"| oauthSvc\n    authHandler -->|\"verify email and reset with\"| oneTimeCode\n    oauthCallback -.->|\"bounces code to app, then\"| oauthSvc\n    loginSvc -->|\"hashes with\"| tokenSecurity\n    loginSvc -->|\"creates row in\"| sessionsTable\n    oauthSvc -->|\"creates row in\"| sessionsTable\n    oneTimeCode -->|\"sends codes by\"| mailer\n    authInterceptor -->|\"adds Bearer token for\"| authenticator\n    authenticator -->|\"looks up hash in\"| sessionsTable\n    authenticator -.->|\"UNAUTHENTICATED signs out\"| sessionStore\n    classDef component fill:#a855f7,stroke:#c084fc,color:#fff\n    classDef composable fill:#7c3aed,stroke:#a78bfa,color:#fff\n    classDef utility fill:#6d28d9,stroke:#8b5cf6,color:#fff\n    classDef external fill:#525252,stroke:#737373,color:#fff\n    classDef event fill:#d8b4fe,stroke:#e9d5ff,color:#000\n    classDef data fill:#9333ea,stroke:#a855f7,color:#fff\n    class sessionStore component\n    click sessionStore nodeClickHandler \"View details\"\n    class authInterceptor utility\n    click authInterceptor nodeClickHandler \"View details\"\n    class authHandler composable\n    click authHandler nodeClickHandler \"View details\"\n    class registerSvc composable\n    click registerSvc nodeClickHandler \"View details\"\n    class loginSvc composable\n    click loginSvc nodeClickHandler \"View details\"\n    class oauthSvc composable\n    click oauthSvc nodeClickHandler \"View details\"\n    class oauthCallback component\n    click oauthCallback nodeClickHandler \"View details\"\n    class tokenSecurity utility\n    click tokenSecurity nodeClickHandler \"View details\"\n    class oneTimeCode composable\n    click oneTimeCode nodeClickHandler \"View details\"\n    class mailer external\n    click mailer nodeClickHandler \"View details\"\n    class authenticator composable\n    click authenticator nodeClickHandler \"View details\"\n    class sessionsTable data\n    click sessionsTable nodeClickHandler \"View details\"\n", "nodes": {"sessionStore": {"title": "Session Store (app)", "type": "component", "description": "The app's global sign-in state, built before the router so the first redirect is right. It restores the saved session and signs out when the server rejects the token.", "files": ["frontend/app/lib/features/auth/presentation/stores/session_store.dart", "frontend/app/lib/features/auth/data/session_repository.dart"], "code": "  Future<void> start() async {\n    _credentials.onRejected = (_) => _expire();\n    final session = await _repository.restore();\n    state.value = session == null ? const SignedOut() : SignedIn(session);", "lang": "dart"}, "authInterceptor": {"title": "App Auth Interceptor", "type": "utility", "description": "Adds authorization: Bearer to every call except the anonymous auth RPCs. A unary UNAUTHENTICATED reports the token as rejected, and a late reply for an older token is ignored.", "files": ["frontend/app/lib/core/network/auth/auth_interceptor.dart", "frontend/app/lib/core/network/auth/session_credentials.dart"], "code": "    response.then<void>((_) {}, onError: (Object error) {\n      if (error is GrpcError && error.code == StatusCode.unauthenticated) {\n        credentials.reject(token);\n      }\n    });", "lang": "dart"}, "authHandler": {"title": "Auth Service Handler", "type": "composable", "description": "A thin gRPC adapter for the 11 auth RPCs that maps domain errors to gRPC codes. The logic lives in internal/auth packages that depend only on interfaces.", "files": ["backend/internal/services/auth_service.go"], "code": "\tres, err := s.login.Login(ctx, req.GetEmail(), req.GetPassword(), clientip.FromContext(ctx))", "lang": "go"}, "registerSvc": {"title": "Registration", "type": "composable", "description": "Validates input, hashes the password with Argon2id and creates the user through the outbox, so the user's own OpenFGA tuples are written in the same transaction.", "files": ["backend/internal/auth/register/service.go", "backend/internal/user/repository.go"], "code": "\t\tchange := authz.NewUser(publicID)", "lang": "go"}, "loginSvc": {"title": "Password Login", "type": "composable", "description": "Refuses after 5 failures per email or 20 per IP in 15 minutes, counted from login_attempts. On success it records the attempt and opens a session.", "files": ["backend/internal/auth/login/service.go", "backend/internal/loginattempt/repository.go"], "code": "\tMaxFailures   = 5\n\tFailureWindow = 15 * time.Minute", "lang": "go"}, "oauthSvc": {"title": "OAuth Login", "type": "composable", "description": "Exchanges the provider code on the server, then logs into the linked account, links a known email, or creates a new account. Providers are only registered when their credentials are set.", "files": ["backend/internal/auth/oauth/service.go", "backend/internal/auth/oauth/google.go", "backend/internal/auth/oauth/intra42.go"], "code": "//  1. identite deja liee -> on connecte\n//  2. email deja connu   -> on lie l'identite au compte existant\n//  3. inconnu            -> on cree le compte et on lie", "lang": "go"}, "oauthCallback": {"title": "OAuth Bounce Page", "type": "component", "description": "Providers only redirect to http(s), so this stateless page forwards the code to the app's musicroom:// scheme. The app then calls OAuthLogin with it.", "files": ["backend/internal/auth/oauth/callback.go"], "code": "const CallbackPath = \"/oauth/callback\"", "lang": "go"}, "tokenSecurity": {"title": "Tokens and Password Hashing", "type": "utility", "description": "Session tokens are 256 random bits hashed with plain SHA-256, which is enough because they cannot be guessed and it runs on every request. Passwords use Argon2id.", "files": ["backend/internal/security/token.go", "backend/internal/security/password.go"], "code": "func HashSessionToken(token string) []byte {", "lang": "go"}, "oneTimeCode": {"title": "One-Time Codes", "type": "composable", "description": "Shared by email verification and password reset: hashed 6-digit codes in user_tokens, valid 15 minutes, 5 tries each, and at most 1 a minute and 5 an hour.", "files": ["backend/internal/auth/onetimecode/service.go", "backend/internal/token/repository.go"], "code": "\tDefaultTTL         = 15 * time.Minute\n\tDefaultMaxAttempts = 5", "lang": "go"}, "mailer": {"title": "Mailer", "type": "external", "description": "A one-method interface: the default writes mail to the log (read codes with docker logs), APP_MAILER=smtp sends for real. An incomplete SMTP config stops the backend at boot.", "files": ["backend/internal/mailer/mailer.go", "backend/internal/mailer/smtp.go"], "code": "type Mailer interface {\n\tSend(ctx context.Context, m Mail) error\n}", "lang": "go"}, "authenticator": {"title": "Session Authenticator", "type": "composable", "description": "Runs inside the interceptor on every protected call and returns an Identity (user, session, device). It slides last_used_at at most once a minute, so a check is not a write each time.", "files": ["backend/internal/auth/authn/authenticator.go"], "code": "\tErrUnknownToken    = errors.New(\"unknown token\")\n\tErrRevoked         = errors.New(\"session revoked\")\n\tErrExpired         = errors.New(\"session expired\")\n\tErrIdle            = errors.New(\"session idle too long\")", "lang": "go"}, "sessionsTable": {"title": "Sessions Table", "type": "data", "description": "user_sessions is the session store: token hash, expiry, idle clock, revocation and device. The lookup joins users so the account status comes for free.", "files": ["backend/db/query/auth.sql", "backend/db/schema/00006_auth.sql"], "code": "FROM user_sessions s\nJOIN users u ON u.id = s.user_id\nWHERE s.token_hash = $1;", "lang": "sql"}}, "legend": [{"label": "Entry point / UI", "color": "#a855f7"}, {"label": "Helper", "color": "#6d28d9"}, {"label": "Logic / Service", "color": "#7c3aed"}, {"label": "External system", "color": "#525252"}, {"label": "Data / State", "color": "#9333ea"}], "pages": [{"slug": "overview", "title": "Music Room: System Overview"}, {"slug": "backend", "title": "Backend Architecture"}, {"slug": "request-pipeline", "title": "Request Pipeline"}, {"slug": "openfga", "title": "OpenFGA Permission Service"}, {"slug": "auth", "title": "Auth and Sessions"}, {"slug": "realtime", "title": "Realtime Updates"}, {"slug": "frontend", "title": "Frontend Architecture"}, {"slug": "track-vote", "title": "Track Vote Events"}, {"slug": "playlist-editor", "title": "Playlist Editor"}, {"slug": "control-delegation", "title": "Control Delegation"}, {"slug": "data-model", "title": "Data Model"}], "slug": "auth"};

// The SVG group that draws a node: flowchart ids look like "flowchart-<id>-<n>",
// ER groups are tagged by attachEntityClicks below.
function nodeElement(root, nodeId) {
  if (KIND === 'er') return root.querySelector(`[data-entity="${nodeId}"]`);
  const re = new RegExp(`^flowchart-${nodeId}-\\d+$`);
  return [...root.querySelectorAll('.node')].find(n => re.test(n.id)) || null;
}
function allNodeElements(root) {
  return root.querySelectorAll(KIND === 'er' ? '[data-entity]' : '.node');
}

// ER entities take no `click` directive: find each entity's group and bind it by hand.
function attachEntityClicks(root, onClick) {
  for (const name of Object.keys(NODES)) {
    let group = root.querySelector(`g[id^="entity-${name}-"], g[id="entity-${name}"]`);
    if (!group) {
      const label = [...root.querySelectorAll('text, span, div, p')]
        .find(el => el.textContent.trim() === name);
      group = label && (label.closest('g.node') || label.closest('g'));
    }
    if (!group) { console.warn('entity not found:', name); continue; }
    group.dataset.entity = name;
    group.classList.add('wt-entity');
    group.addEventListener('click', () => onClick(name));
  }
}

function usePanZoom() {
  const viewportRef = useRef(null), canvasRef = useRef(null), zoomDisplayRef = useRef(null);
  const st = useRef({ zoom: 1, panX: 0, panY: 0 });
  const drag = useRef({ on: false, lx: 0, ly: 0 });

  const apply = useCallback(() => {
    const { zoom, panX, panY } = st.current;
    if (canvasRef.current) canvasRef.current.style.transform = `translate(${panX}px,${panY}px) scale(${zoom})`;
    if (zoomDisplayRef.current) zoomDisplayRef.current.textContent = Math.round(zoom * 100) + '%';
  }, []);

  const fitToScreen = useCallback(() => {
    const svg = canvasRef.current?.querySelector('svg');
    const vp = viewportRef.current;
    if (!svg || !vp) return;
    const s = st.current;
    const vw = vp.clientWidth, vh = vp.clientHeight;
    const sw = canvasRef.current.getBoundingClientRect().width / s.zoom;
    const sh = canvasRef.current.getBoundingClientRect().height / s.zoom;
    const fit = Math.max(0.15, Math.min(2, Math.min((vw - 40) / sw, (vh - 40) / sh)));
    s.zoom = fit; s.panX = (vw - sw * fit) / 2; s.panY = (vh - sh * fit) / 2;
    apply();
  }, [apply]);

  useEffect(() => {
    const vp = viewportRef.current;
    if (!vp) return;
    const onWheel = (e) => {
      e.preventDefault();
      const r = vp.getBoundingClientRect();
      const mx = e.clientX - r.left, my = e.clientY - r.top, s = st.current;
      const f = e.deltaY < 0 ? 1.12 : 1 / 1.12;
      const nz = Math.min(4, Math.max(0.15, s.zoom * f)), sc = nz / s.zoom;
      s.panX = mx - sc * (mx - s.panX); s.panY = my - sc * (my - s.panY); s.zoom = nz;
      apply();
    };
    const onDown = (e) => {
      if (e.target.closest('.node, .wt-entity')) return;
      drag.current = { on: true, lx: e.clientX, ly: e.clientY };
      vp.setPointerCapture(e.pointerId);
    };
    const onMove = (e) => {
      const d = drag.current; if (!d.on) return;
      st.current.panX += e.clientX - d.lx; st.current.panY += e.clientY - d.ly;
      d.lx = e.clientX; d.ly = e.clientY; apply();
    };
    const onUp = () => { drag.current.on = false; };
    vp.addEventListener('wheel', onWheel, { passive: false });
    vp.addEventListener('pointerdown', onDown);
    vp.addEventListener('pointermove', onMove);
    vp.addEventListener('pointerup', onUp);
    vp.addEventListener('pointercancel', onUp);
    window.addEventListener('resize', fitToScreen);
    return () => {
      vp.removeEventListener('wheel', onWheel);
      vp.removeEventListener('pointerdown', onDown);
      vp.removeEventListener('pointermove', onMove);
      vp.removeEventListener('pointerup', onUp);
      vp.removeEventListener('pointercancel', onUp);
      window.removeEventListener('resize', fitToScreen);
    };
  }, [apply, fitToScreen]);

  const zoomIn = useCallback(() => { st.current.zoom = Math.min(4, st.current.zoom * 1.25); apply(); }, [apply]);
  const zoomOut = useCallback(() => { st.current.zoom = Math.max(0.15, st.current.zoom / 1.25); apply(); }, [apply]);
  return { viewportRef, canvasRef, zoomDisplayRef, zoomIn, zoomOut, fitToScreen };
}

function MermaidDiagram({ onNodeClick, onRendered }) {
  const ref = useRef(null);
  useEffect(() => {
    window.nodeClickHandler = onNodeClick;
    mermaid.initialize(MERMAID_CONFIG);
    mermaid.render('walkthrough-diagram', DIAGRAM).then(({ svg, bindFunctions }) => {
      if (!ref.current) return;
      ref.current.innerHTML = svg;
      bindFunctions?.(ref.current);
      if (KIND === 'er') attachEntityClicks(ref.current, onNodeClick);
      document.body.dataset.rendered = 'true';
      onRendered();
    }).catch((e) => {
      console.error('Mermaid render failed:', e);
      document.body.dataset.rendered = 'error';
      if (ref.current) ref.current.textContent = 'Diagram failed to render: ' + e.message;
    });
    return () => { delete window.nodeClickHandler; };
  }, [onNodeClick, onRendered]);
  return h('div', { ref, className: 'mermaid-wrap' });
}

function DetailPanel({ nodeId, node, onClose }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [onClose]);
  const codeHtml = HIGHLIGHTED[nodeId];
  return h('div', {
    className: 'fixed top-4 right-4 bottom-4 w-[560px] max-w-[calc(100vw-2rem)] z-30 bg-wt-surface border border-wt-border rounded-xl shadow-2xl flex flex-col overflow-hidden',
  },
    h('button', {
      onClick: onClose,
      className: 'absolute top-3 right-3 z-10 w-7 h-7 rounded-md border border-wt-border bg-wt-raised text-wt-muted flex items-center justify-center text-lg hover:bg-wt-red hover:border-wt-red hover:text-white transition-colors',
    }, '×'),
    h('div', { className: 'flex-1 overflow-y-auto p-5' },
      h('h2', { className: 'text-lg font-bold text-wt-fg mb-3 pr-9' }, node.title),
      h('div', { className: 'dt-body' }, h('p', null, node.description)),
      h('div', { className: 'dt-body' },
        codeHtml
          ? h('div', { dangerouslySetInnerHTML: { __html: codeHtml } })
          : h('pre', { className: 'code-fallback' }, h('code', null, node.code))),
      h('div', { className: 'mt-4 pt-3 border-t border-wt-border' },
        h('div', { className: 'text-[0.7rem] uppercase tracking-wider text-wt-muted font-semibold mb-1.5' }, 'Files'),
        h('code', { className: 'text-sm text-wt-file font-mono leading-relaxed break-all' },
          node.files.map((f, i) => h('span', { key: i }, f, h('br'))))))
  );
}

function ZoomControls({ zoomDisplayRef, onZoomIn, onZoomOut, onFit }) {
  const btn = 'w-8 h-8 rounded-md border border-wt-border bg-wt-surface text-wt-muted hover:bg-wt-raised hover:text-wt-fg transition-colors text-sm';
  return h('div', { className: 'fixed bottom-5 left-5 z-20 flex items-center gap-1.5' },
    h('button', { className: btn, onClick: onZoomOut, title: 'Zoom out' }, '−'),
    h('span', { ref: zoomDisplayRef, className: 'w-12 text-center text-xs text-wt-muted tabular-nums' }, '100%'),
    h('button', { className: btn, onClick: onZoomIn, title: 'Zoom in' }, '+'),
    h('button', { className: btn + ' w-auto px-2.5', onClick: onFit, title: 'Fit to screen' }, 'Fit'));
}

function App() {
  const [activeId, setActiveId] = useState(null);
  const [summaryCollapsed, setSummaryCollapsed] = useState(true);
  const pz = usePanZoom();

  const setActiveNode = useCallback((nodeId) => {
    setActiveId(nodeId);
    const root = document.querySelector('.mermaid-wrap');
    allNodeElements(root).forEach(n => { n.style.opacity = nodeId ? '0.4' : '1'; });
    const el = nodeId && nodeElement(root, nodeId);
    if (el) el.style.opacity = '1';
  }, []);
  const closeDetail = useCallback(() => {
    setActiveId(null);
    allNodeElements(document.querySelector('.mermaid-wrap')).forEach(n => { n.style.opacity = '1'; });
  }, []);
  const onRendered = useCallback(() => { setTimeout(pz.fitToScreen, 50); }, [pz.fitToScreen]);

  return h(React.Fragment, null,
    h('header', { className: 'fixed top-0 inset-x-0 z-10 px-6 py-3.5 bg-gradient-to-b from-wt-bg to-transparent pointer-events-none' },
      h('h1', { className: 'text-base font-semibold text-wt-fg' }, TITLE),
      h('p', { className: 'text-sm text-wt-muted mt-0.5' }, SUBTITLE)),
    h(Summary, { collapsed: summaryCollapsed, onToggle: () => setSummaryCollapsed(c => !c) }),
    h('div', { ref: pz.viewportRef, className: 'w-full h-screen overflow-hidden cursor-grab active:cursor-grabbing' },
      h('div', { ref: pz.canvasRef, className: 'origin-top-left will-change-transform inline-block p-[80px_60px_60px]' },
        h(MermaidDiagram, { onNodeClick: setActiveNode, onRendered }))),
    h(ZoomControls, { zoomDisplayRef: pz.zoomDisplayRef, onZoomIn: pz.zoomIn, onZoomOut: pz.zoomOut, onFit: pz.fitToScreen }),
    h('div', { className: 'fixed bottom-5 left-1/2 -translate-x-1/2 z-20 flex flex-wrap justify-center gap-4 px-4 py-2 bg-wt-surface border border-wt-border rounded-lg shadow-xl' },
      LEGEND.map(l => h('span', { key: l.label, className: 'flex items-center gap-1.5 text-xs text-wt-muted whitespace-nowrap' },
        h('span', { className: 'w-2 h-2 rounded-full', style: { background: l.color } }), l.label))),
    h(PageNav),
    activeId && NODES[activeId] && h(DetailPanel, { nodeId: activeId, node: NODES[activeId], onClose: closeDetail }),
    h('div', { className: 'fixed bottom-5 right-5 z-20 text-xs text-wt-muted opacity-50' },
      h('kbd', null, 'Scroll'), ' zoom · ', h('kbd', null, 'Drag'), ' pan · Click nodes'));
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
