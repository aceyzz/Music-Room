<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playlist Editor · Music Room</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: { colors: {
      wt: {
        bg: '#000000', surface: '#0a0a0a', raised: '#141414',
        border: '#2a2a2a', fg: '#ffffff', muted: '#a0a0a0',

<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

<style>
  html, body { background: #000; color: #fff; margin: 0; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; }
  .mermaid-wrap svg { max-width: none !important; height: auto !important; }
  .mermaid-wrap .node { cursor: pointer; }
  .mermaid-wrap .node:hover rect,
  .mermaid-wrap .node:hover polygon,
  .mermaid-wrap .node:hover circle,
  .mermaid-wrap .node:hover .label-container { filter: brightness(1.3); transition: filter .15s; }
  .mermaid-wrap .wt-entity { cursor: pointer; }
  .mermaid-wrap .wt-entity:hover { filter: brightness(1.3); transition: filter .15s; }
  .dt-body p { color:#a0a0a0; font-size:.88rem; line-height:1.65; margin-bottom:10px; }

<body class="bg-wt-bg">
<div id="root"></div>
<script type="module">
let createHighlighter = null;
try {
  ({ createHighlighter } = await import('https://cdn.jsdelivr.net/npm/shiki@3.22.0/+esm'));
} catch (e) { console.warn('Shiki unavailable:', e); }

const { useState, useEffect, useRef, useCallback } = React;
const h = React.createElement;

const DATA = {"title": "Playlist Editor", "subtitle": "Collaborative playlists: many people add, remove and move songs at the same time", "kind": "flow", "summary": "Each song edit is one transaction in three steps: bump the playlist's revision (which takes its row lock), make the change, then append an op at that revision.\nThe lock serialises concurrent editors, so revisions are gapless and two people adding the same song cannot both pass the duplicate check.\nPositions are decimals, so a move just takes the midpoint between neighbours; after commit every open WatchPlaylist re-sends the full playlist.", "diagram": "\ngraph TD\n    subgraph app[\"Phone App\"]\n        editorStore[\"Playlist Editor Store\"]\n    end\n    subgraph api[\"API and Rules\"]\n        playlistRpcs[\"PlaylistService RPCs\"]\n        editRule[\"Edit Permission\"]\n    end\n    subgraph edit[\"One Edit = One Transaction\"]\n        songEdits[\"Song Edit Handlers\"]\n        bumpRevision[(\"Bump Revision\")]\n        movePosition[(\"Midpoint Move\")]\n        appendOp[(\"Append Op\")]\n    end\n    subgraph after[\"After Commit\"]\n        settingsRepo[\"Settings via Outbox\"]\n        watchPlaylist[\"WatchPlaylist Stream\"]\n        playlistTables[(\"Playlist Tables\")]\n    end\n    editorStore -->|\"calls\"| playlistRpcs\n    playlistRpcs -->|\"checked against\"| editRule\n    playlistRpcs -->|\"routes edits to\"| songEdits\n    playlistRpcs -->|\"routes settings to\"| settingsRepo\n    songEdits -->|\"step 1\"| bumpRevision\n    songEdits -->|\"step 2 for a move\"| movePosition\n    songEdits -->|\"step 3\"| appendOp\n    bumpRevision -->|\"locks row in\"| playlistTables\n    appendOp -->|\"writes to\"| playlistTables\n    settingsRepo -->|\"also appends\"| appendOp\n    songEdits ==>|\"publish change\"| watchPlaylist\n    watchPlaylist -.->|\"pushes full playlist to\"| editorStore\n    classDef component fill:#a855f7,stroke:#c084fc,color:#fff\n    classDef composable fill:#7c3aed,stroke:#a78bfa,color:#fff\n    classDef utility fill:#6d28d9,stroke:#8b5cf6,color:#fff\n    classDef external fill:#525252,stroke:#737373,color:#fff\n    classDef event fill:#d8b4fe,stroke:#e9d5ff,color:#000\n    classDef data fill:#9333ea,stroke:#a855f7,color:#fff\n    class editorStore component\n    click editorStore nodeClickHandler \"View details\"\n    class playlistRpcs composable\n    click playlistRpcs nodeClickHandler \"View details\"\n    class editRule data\n    click editRule nodeClickHandler \"View details\"\n    class songEdits composable\n    click songEdits nodeClickHandler \"View details\"\n    class bumpRevision data\n    click bumpRevision nodeClickHandler \"View details\"\n    class movePosition data\n    click movePosition nodeClickHandler \"View details\"\n    class appendOp data\n    click appendOp nodeClickHandler \"View details\"\n    class settingsRepo composable\n    click settingsRepo nodeClickHandler \"View details\"\n    class watchPlaylist composable\n    click watchPlaylist nodeClickHandler \"View details\"\n    class playlistTables data\n    click playlistTables nodeClickHandler \"View details\"\n", "nodes": {"editorStore": {"title": "Playlist Editor Store (app)", "type": "component", "description": "Holds the WatchPlaylist stream and applies removes and moves on screen before the server answers. It drops any pushed state older than the revision it already shows.", "files": ["frontend/app/lib/features/music/playlist/presentation/stores/playlist_editor_store.dart"], "code": "    if (!force && shown != null && contents.details.revision < shown) {", "lang": "dart"}, "playlistRpcs": {"title": "PlaylistService RPCs", "type": "composable", "description": "19 RPCs: create, rename, visibility, edit licence, members, invites, covers, add/remove/move song, WatchPlaylist and ListPlaylistOpsSince.", "files": ["proto/music_room/v1/services/playlist_service.proto"], "code": "  rpc WatchPlaylist(WatchPlaylistRequest) returns (stream WatchPlaylistResponse) {\n  rpc ListPlaylistOpsSince(ListPlaylistOpsSinceRequest) returns (ListPlaylistOpsSinceResponse) {", "lang": "proto"}, "editRule": {"title": "Edit Permission (OpenFGA)", "type": "data", "description": "One permission covers add, remove and move. Licence everyone still needs can_view, so a private playlist is never writable by strangers.", "files": ["authz/model.fga"], "code": "    define can_edit_songs: owner or admin or editor or (can_view and open_edit)", "lang": "text"}, "songEdits": {"title": "Song Edit Handlers", "type": "composable", "description": "AddSong, RemoveSong and MoveSong each run bump, change and append-op in one transaction. Then they re-read the list and publish the playlist topic.", "files": ["backend/internal/playlist/service.go"], "code": "\t\trevision, err := queries.BumpPlaylistRevision(ctx, req.GetPlaylistId())", "lang": "go"}, "bumpRevision": {"title": "1. Bump Revision (row lock)", "type": "data", "description": "The UPDATE takes the playlist's row lock and returns the next revision. Concurrent editors wait their turn here, which is what keeps revisions gapless.", "files": ["backend/db/query/playlists.sql"], "code": "UPDATE playlists\nSET revision = revision + 1\nWHERE id = $1\n  AND deleted_at IS NULL\nRETURNING revision;", "lang": "sql"}, "movePosition": {"title": "2. Midpoint Move", "type": "data", "description": "position is NUMERIC: a moved song lands halfway between its anchor and the next song, so nothing is ever renumbered. If the song or anchor is gone, zero rows come back and the RPC says NotFound.", "files": ["backend/db/query/playlists.sql"], "code": "        COALESCE(((SELECT position FROM anchor) + (SELECT position FROM next_after_anchor)) * 0.5,\n                 (SELECT position FROM anchor) + 1)", "lang": "sql"}, "appendOp": {"title": "3. Append Op", "type": "data", "description": "Records the change in playlist_ops at that revision, with a JSONB payload. ListPlaylistOpsSince reads them back in order for a client that missed some.", "files": ["backend/db/query/playlists.sql"], "code": "SELECT * FROM playlist_ops\nWHERE playlist_id = sqlc.arg('playlist_id')\n  AND revision > sqlc.arg('since_revision')\nORDER BY revision;", "lang": "sql"}, "settingsRepo": {"title": "Settings via Outbox", "type": "composable", "description": "Changes that alter access (create, visibility, edit licence, members, owner transfer, cover) go through outbox.InTx so their OpenFGA tuples commit with them. They bump the revision and append an op too.", "files": ["backend/internal/playlist/repository.go"], "code": "func (r *Repository) SetVisibility(ctx context.Context, playlistID int64, visibility sqlc.ResourceVisibility) (sqlc.Playlist, error) {\n\treturn outbox.InTx(ctx, r.outbox, r.db,", "lang": "go"}, "watchPlaylist": {"title": "WatchPlaylist Stream", "type": "composable", "description": "Subscribes, sends the full playlist with viewer_can_edit_songs, then re-sends after each signal. It re-checks can_view every 5 s.", "files": ["backend/internal/playlist/service.go"], "code": "\tchanged, stop := s.hub.Subscribe(realtime.Playlist(req.GetPlaylistId()))", "lang": "go"}, "playlistTables": {"title": "Playlist Tables", "type": "data", "description": "playlists (revision, visibility, edit_license), playlist_members (role), playlist_invitations, playlist_songs and playlist_ops. The unique (playlist, revision) key catches any write path that skips step 1.", "files": ["backend/db/schema/00011_playlists.sql"], "code": "    CONSTRAINT playlist_ops_revision_key UNIQUE (playlist_id, revision)", "lang": "sql"}}, "legend": [{"label": "Entry point / UI", "color": "#a855f7"}, {"label": "Logic / Service", "color": "#7c3aed"}, {"label": "Data / State", "color": "#9333ea"}], "pages": [{"slug": "overview", "title": "Music Room: System Overview"}, {"slug": "backend", "title": "Backend Architecture"}, {"slug": "request-pipeline", "title": "Request Pipeline"}, {"slug": "openfga", "title": "OpenFGA Permission Service"}, {"slug": "auth", "title": "Auth and Sessions"}, {"slug": "realtime", "title": "Realtime Updates"}, {"slug": "frontend", "title": "Frontend Architecture"}, {"slug": "track-vote", "title": "Track Vote Events"}, {"slug": "playlist-editor", "title": "Playlist Editor"}, {"slug": "control-delegation", "title": "Control Delegation"}, {"slug": "data-model", "title": "Data Model"}], "slug": "playlist-editor"};
const { title: TITLE, subtitle: SUBTITLE, kind: KIND, summary: SUMMARY,
        diagram: DIAGRAM, nodes: NODES, legend: LEGEND, pages: PAGES, slug: SLUG } = DATA;

// Pre-highlight every snippet once; the panel falls back to plain <pre> if Shiki fails.
const langs = [...new Set(Object.values(NODES).map(n => n.lang).filter(l => l && l !== 'text'))];
let highlighter = null;
if (createHighlighter) {
  try { highlighter = await createHighlighter({ themes: ['vitesse-dark'], langs }); }
  catch (e) { console.warn('Shiki failed:', e); }
}
const HIGHLIGHTED = {};
for (const [id, node] of Object.entries(NODES)) {
  if (node.code && highlighter) {
    try { HIGHLIGHTED[id] = highlighter.codeToHtml(node.code, { lang: node.lang, theme: 'vitesse-dark' }); }
    catch (e) { console.warn(`Highlight failed for ${id}:`, e); }
  }
}

const MERMAID_THEME = {
  primaryColor: '#0a0a0a', primaryTextColor: '#ffffff', primaryBorderColor: '#2a2a2a',
  lineColor: '#a0a0a0', background: '#000000',
};
const MERMAID_CONFIG = KIND === 'er'
  ? {
      startOnLoad: false, theme: 'dark', securityLevel: 'loose',
      themeVariables: {
        ...MERMAID_THEME,
        entityBkg: '#0a0a0a', entityBorder: '#7c3aed', entityTextColor: '#ffffff',
        attributeBackgroundColorEven: '#0a0a0a', attributeBackgroundColorOdd: '#141414',
        labelColor: '#a0a0a0', relationColor: '#a855f7',
      },
      er: { useMaxWidth: false, layoutDirection: 'TB' },
    }
  : {
      startOnLoad: false, theme: 'dark', securityLevel: 'loose',
      themeVariables: {
        ...MERMAID_THEME,
        secondaryColor: '#000000', tertiaryColor: '#000000',
        mainBkg: '#0a0a0a', nodeBorder: '#2a2a2a',
        clusterBkg: 'rgba(10,10,10,0.8)', clusterBorder: '#7c3aed',
        titleColor: '#ffffff', edgeLabelBackground: 'transparent',
      },
      flowchart: { useMaxWidth: false, htmlLabels: true, curve: 'basis' },
    };

// The SVG group that draws a node: flowchart ids look like "flowchart-<id>-<n>",
// ER groups are tagged by attachEntityClicks below.
function nodeElement(root, nodeId) {
  if (KIND === 'er') return root.querySelector(`[data-entity="${nodeId}"]`);
  const re = new RegExp(`^flowchart-${nodeId}-\\d+$`);
  return [...root.querySelectorAll('.node')].find(n => re.test(n.id)) || null;
}
function allNodeElements(root) {
  return root.querySelectorAll(KIND === 'er' ? '[data-entity]' : '.node');
}

// ER entities take no `click` directive: find each entity's group and bind it by hand.
function attachEntityClicks(root, onClick) {
  for (const name of Object.keys(NODES)) {
    let group = root.querySelector(`g[id^="entity-${name}-"], g[id="entity-${name}"]`);
    if (!group) {
      const label = [...root.querySelectorAll('text, span, div, p')]
        .find(el => el.textContent.trim() === name);
      group = label && (label.closest('g.node') || label.closest('g'));
    }
    if (!group) { console.warn('entity not found:', name); continue; }
    group.dataset.entity = name;
    group.classList.add('wt-entity');
    group.addEventListener('click', () => onClick(name));
  }
}

function usePanZoom() {
  const viewportRef = useRef(null), canvasRef = useRef(null), zoomDisplayRef = useRef(null);
  const st = useRef({ zoom: 1, panX: 0, panY: 0 });
  const drag = useRef({ on: false, lx: 0, ly: 0 });

  const apply = useCallback(() => {
    const { zoom, panX, panY } = st.current;
    if (canvasRef.current) canvasRef.current.style.transform = `translate(${panX}px,${panY}px) scale(${zoom})`;
    if (zoomDisplayRef.current) zoomDisplayRef.current.textContent = Math.round(zoom * 100) + '%';
  }, []);

  const fitToScreen = useCallback(() => {
    const svg = canvasRef.current?.querySelector('svg');
    const vp = viewportRef.current;
    if (!svg || !vp) return;
    const s = st.current;
    const vw = vp.clientWidth, vh = vp.clientHeight;
    const sw = canvasRef.current.getBoundingClientRect().width / s.zoom;
    const sh = canvasRef.current.getBoundingClientRect().height / s.zoom;
    const fit = Math.max(0.15, Math.min(2, Math.min((vw - 40) / sw, (vh - 40) / sh)));
    s.zoom = fit; s.panX = (vw - sw * fit) / 2; s.panY = (vh - sh * fit) / 2;
    apply();
  }, [apply]);

  useEffect(() => {
    const vp = viewportRef.current;
    if (!vp) return;
    const onWheel = (e) => {
      e.preventDefault();
      const r = vp.getBoundingClientRect();
      const mx = e.clientX - r.left, my = e.clientY - r.top, s = st.current;
      const f = e.deltaY < 0 ? 1.12 : 1 / 1.12;
      const nz = Math.min(4, Math.max(0.15, s.zoom * f)), sc = nz / s.zoom;
      s.panX = mx - sc * (mx - s.panX); s.panY = my - sc * (my - s.panY); s.zoom = nz;
      apply();
    };
    const onDown = (e) => {
      if (e.target.closest('.node, .wt-entity')) return;
      drag.current = { on: true, lx: e.clientX, ly: e.clientY };
      vp.setPointerCapture(e.pointerId);
    };
    const onMove = (e) => {
      const d = drag.current; if (!d.on) return;
      st.current.panX += e.clientX - d.lx; st.current.panY += e.clientY - d.ly;
      d.lx = e.clientX; d.ly = e.clientY; apply();
    };
    const onUp = () => { drag.current.on = false; };
    vp.addEventListener('wheel', onWheel, { passive: false });
    vp.addEventListener('pointerdown', onDown);
    vp.addEventListener('pointermove', onMove);
    vp.addEventListener('pointerup', onUp);
    vp.addEventListener('pointercancel', onUp);
    window.addEventListener('resize', fitToScreen);
    return () => {
      vp.removeEventListener('wheel', onWheel);
      vp.removeEventListener('pointerdown', onDown);
      vp.removeEventListener('pointermove', onMove);
      vp.removeEventListener('pointerup', onUp);
      vp.removeEventListener('pointercancel', onUp);
      window.removeEventListener('resize', fitToScreen);
    };
  }, [apply, fitToScreen]);

  const zoomIn = useCallback(() => { st.current.zoom = Math.min(4, st.current.zoom * 1.25); apply(); }, [apply]);
  const zoomOut = useCallback(() => { st.current.zoom = Math.max(0.15, st.current.zoom / 1.25); apply(); }, [apply]);
  return { viewportRef, canvasRef, zoomDisplayRef, zoomIn, zoomOut, fitToScreen };
}

function MermaidDiagram({ onNodeClick, onRendered }) {
  const ref = useRef(null);
  useEffect(() => {
    window.nodeClickHandler = onNodeClick;
    mermaid.initialize(MERMAID_CONFIG);
    mermaid.render('walkthrough-diagram', DIAGRAM).then(({ svg, bindFunctions }) => {
      if (!ref.current) return;
      ref.current.innerHTML = svg;
      bindFunctions?.(ref.current);
      if (KIND === 'er') attachEntityClicks(ref.current, onNodeClick);
      document.body.dataset.rendered = 'true';
      onRendered();
    }).catch((e) => {
      console.error('Mermaid render failed:', e);
      document.body.dataset.rendered = 'error';
      if (ref.current) ref.current.textContent = 'Diagram failed to render: ' + e.message;
    });
    return () => { delete window.nodeClickHandler; };
  }, [onNodeClick, onRendered]);
  return h('div', { ref, className: 'mermaid-wrap' });
}

function Summary({ collapsed, onToggle }) {
  if (collapsed) {
    return h('div', {
      onClick: onToggle,
      className: 'fixed top-16 left-6 z-10 px-3 py-1.5 bg-wt-surface/60 backdrop-blur border border-wt-border rounded-full shadow-lg cursor-pointer hover:bg-wt-surface/80 transition-all duration-300',
    }, h('span', { className: 'text-xs text-wt-muted font-medium' }, 'ℹ︎ Summary'));
  }
  return h('div', {
    onClick: onToggle,
    className: 'fixed top-16 left-6 z-10 max-w-lg px-4 py-3 bg-wt-surface/80 backdrop-blur border border-wt-border rounded-lg shadow-lg cursor-pointer transition-all duration-300',
  },
    h('p', { className: 'text-sm text-wt-muted leading-relaxed' }, SUMMARY),
    h('p', { className: 'text-[0.65rem] text-wt-muted/50 mt-1.5' }, 'Click to dismiss'));
}

function DetailPanel({ nodeId, node, onClose }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [onClose]);
  const codeHtml = HIGHLIGHTED[nodeId];
  return h('div', {
    className: 'fixed top-4 right-4 bottom-4 w-[560px] max-w-[calc(100vw-2rem)] z-30 bg-wt-surface border border-wt-border rounded-xl shadow-2xl flex flex-col overflow-hidden',
  },
    h('button', {
      onClick: onClose,
      className: 'absolute top-3 right-3 z-10 w-7 h-7 rounded-md border border-wt-border bg-wt-raised text-wt-muted flex items-center justify-center text-lg hover:bg-wt-red hover:border-wt-red hover:text-white transition-colors',
    }, '×'),
    h('div', { className: 'flex-1 overflow-y-auto p-5' },
      h('h2', { className: 'text-lg font-bold text-wt-fg mb-3 pr-9' }, node.title),
      h('div', { className: 'dt-body' }, h('p', null, node.description)),
      h('div', { className: 'dt-body' },
        codeHtml
          ? h('div', { dangerouslySetInnerHTML: { __html: codeHtml } })
          : h('pre', { className: 'code-fallback' }, h('code', null, node.code))),
      h('div', { className: 'mt-4 pt-3 border-t border-wt-border' },
        h('div', { className: 'text-[0.7rem] uppercase tracking-wider text-wt-muted font-semibold mb-1.5' }, 'Files'),
        h('code', { className: 'text-sm text-wt-file font-mono leading-relaxed break-all' },
          node.files.map((f, i) => h('span', { key: i }, f, h('br'))))))
  );
}

function ZoomControls({ zoomDisplayRef, onZoomIn, onZoomOut, onFit }) {
  const btn = 'w-8 h-8 rounded-md border border-wt-border bg-wt-surface text-wt-muted hover:bg-wt-raised hover:text-wt-fg transition-colors text-sm';
  return h('div', { className: 'fixed bottom-5 left-5 z-20 flex items-center gap-1.5' },
    h('button', { className: btn, onClick: onZoomOut, title: 'Zoom out' }, '−'),
    h('span', { ref: zoomDisplayRef, className: 'w-12 text-center text-xs text-wt-muted tabular-nums' }, '100%'),
    h('button', { className: btn, onClick: onZoomIn, title: 'Zoom in' }, '+'),
    h('button', { className: btn + ' w-auto px-2.5', onClick: onFit, title: 'Fit to screen' }, 'Fit'));
}

// Jump between the walkthroughs of this folder.
function PageNav() {
  return h('div', { className: 'fixed top-3.5 right-5 z-20' },
    h('select', {
      value: SLUG,
      onChange: (e) => { window.location.href = `walkthrough-${e.target.value}.html`; },
      className: 'bg-wt-surface border border-wt-border rounded-md text-xs text-wt-muted px-2 py-1.5 cursor-pointer',
      'aria-label': 'Other walkthroughs',
    }, PAGES.map(p => h('option', { key: p.slug, value: p.slug }, p.title))));
}

function App() {
  const [activeId, setActiveId] = useState(null);
  const [summaryCollapsed, setSummaryCollapsed] = useState(true);
  const pz = usePanZoom();

  const setActiveNode = useCallback((nodeId) => {
    setActiveId(nodeId);
    const root = document.querySelector('.mermaid-wrap');
    allNodeElements(root).forEach(n => { n.style.opacity = nodeId ? '0.4' : '1'; });
    const el = nodeId && nodeElement(root, nodeId);
    if (el) el.style.opacity = '1';
  }, []);
  const closeDetail = useCallback(() => {
    setActiveId(null);
    allNodeElements(document.querySelector('.mermaid-wrap')).forEach(n => { n.style.opacity = '1'; });
  }, []);
  const onRendered = useCallback(() => { setTimeout(pz.fitToScreen, 50); }, [pz.fitToScreen]);

  return h(React.Fragment, null,
    h('header', { className: 'fixed top-0 inset-x-0 z-10 px-6 py-3.5 bg-gradient-to-b from-wt-bg to-transparent pointer-events-none' },
      h('h1', { className: 'text-base font-semibold text-wt-fg' }, TITLE),
      h('p', { className: 'text-sm text-wt-muted mt-0.5' }, SUBTITLE)),
    h(Summary, { collapsed: summaryCollapsed, onToggle: () => setSummaryCollapsed(c => !c) }),
    h('div', { ref: pz.viewportRef, className: 'w-full h-screen overflow-hidden cursor-grab active:cursor-grabbing' },
      h('div', { ref: pz.canvasRef, className: 'origin-top-left will-change-transform inline-block p-[80px_60px_60px]' },
        h(MermaidDiagram, { onNodeClick: setActiveNode, onRendered }))),
    h(ZoomControls, { zoomDisplayRef: pz.zoomDisplayRef, onZoomIn: pz.zoomIn, onZoomOut: pz.zoomOut, onFit: pz.fitToScreen }),
    h('div', { className: 'fixed bottom-5 left-1/2 -translate-x-1/2 z-20 flex flex-wrap justify-center gap-4 px-4 py-2 bg-wt-surface border border-wt-border rounded-lg shadow-xl' },
      LEGEND.map(l => h('span', { key: l.label, className: 'flex items-center gap-1.5 text-xs text-wt-muted whitespace-nowrap' },
        h('span', { className: 'w-2 h-2 rounded-full', style: { background: l.color } }), l.label))),
    h(PageNav),
    activeId && NODES[activeId] && h(DetailPanel, { nodeId: activeId, node: NODES[activeId], onClose: closeDetail }),
    h('div', { className: 'fixed bottom-5 right-5 z-20 text-xs text-wt-muted opacity-50' },
      h('kbd', null, 'Scroll'), ' zoom · ', h('kbd', null, 'Drag'), ' pan · Click nodes'));
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
